<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mode7 Demo</title>
<style>
  html, body { margin: 0; background: #050b14; color: #cfd8e3; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 480px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p.lead { color: #8a97a8; font-size: 13px; margin: 0 0 24px; }
  p.lead a { color: #22e0ff; }
  .demo { background: #0b1220; border: 1.5px solid rgba(255,45,149,.6); border-radius: 10px;
    padding: 26px 20px; text-align: center;
    box-shadow: 0 0 26px rgba(255,45,149,.24), inset 0 0 22px rgba(255,45,149,.05); }
  canvas { border-radius: 8px; border: 2px solid rgba(34,224,255,.5); background: #050b14;
    box-shadow: inset 0 0 22px rgba(0,0,0,.9), 0 0 16px rgba(34,224,255,.2);
    max-width: 100%; height: auto; display: block; margin: 0 auto 18px; cursor: pointer;
    touch-action: none; }
  .fields { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .field label { font-size: 11px; letter-spacing: .5px; color: #8a97a8; }
  .field label span { color: #22e0ff; }
  .field input[type="range"] { width: 130px; accent-color: #22e0ff; }
  .hint { font-size: 11px; letter-spacing: .3px; color: #8a97a8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mode7 Demo</h1>
  <p class="lead">
    Scanline-based perspective rendering in a &lt;canvas&gt;, steerable with arrow keys or by
    clicking/holding the canvas. See
    <a href="https://jonnymatic.com/blog/gamedev-mode7-html5/">the article</a>
    for how it works, including the real SNES hardware comparison and the affine-transform math.
  </p>
  <div class="demo">
    <canvas id="canvas_v" width="360" height="200"></canvas>
    <div class="fields">
      <div class="field">
        <label for="omega">OMEGA <span id="omega-v">108°</span></label>
        <input id="omega" type="range" min="0" max="180" value="108">
      </div>
      <div class="field">
        <label for="theta">THETA <span id="theta-v">60°</span></label>
        <input id="theta" type="range" min="0" max="180" value="60">
      </div>
      <div class="field">
        <label for="alpha">ALPHA <span id="alpha-v">45°</span></label>
        <input id="alpha" type="range" min="0" max="90" value="45">
      </div>
      <div class="field">
        <label for="height">HEIGHT <span id="height-v">25px</span></label>
        <input id="height" type="range" min="0" max="100" value="25">
      </div>
    </div>
    <div class="hint">arrow keys, or click/hold the canvas, to drive</div>
  </div>
</div>
<script src="mode7.js"></script>
</body>
</html>
